<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>FOUNDRY // COMMAND</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap');
        body { font-family: 'JetBrains+Mono', monospace; background-color: #020617; color: #f8fafc; }
        label { font-size: 9px; font-weight: 900; color: #64748b; text-transform: uppercase; display: block; margin-bottom: 4px; }
    </style>
</head>
<body class="p-10">
    <header class="flex justify-between items-end mb-12 border-b border-zinc-800 pb-8 text-white">
        <div>
            <h1 class="text-[10px] font-black text-blue-500 uppercase tracking-[0.4em] mb-2">Foundry_Command</h1>
            <h2 id="proj-name" class="text-6xl font-black uppercase italic tracking-tighter">Loading...</h2>
        </div>
        <div class="text-right">
            <a href="/index.html" class="text-zinc-500 text-[10px] font-black uppercase tracking-widest">Back_to_Vault</a>
        </div>
    </header>

    <div class="grid grid-cols-4 gap-6 mb-12">
        <div class="bg-zinc-900 border border-zinc-800 p-8"><label>Build_Capacity</label><div id="build-capacity" class="text-5xl font-black text-white italic">0</div></div>
        <div class="bg-zinc-900 border border-zinc-800 p-8"><label>Unit_COGS</label><div id="unit-cost" class="text-5xl font-black text-emerald-400 italic">$0.00</div></div>
        <div class="bg-zinc-900 border border-zinc-800 p-8"><label>Bottleneck</label><div id="critical-part" class="text-xl font-black text-orange-500 uppercase mt-4 italic">Healthy</div></div>
        <div class="bg-zinc-900 border border-zinc-800 p-8 flex flex-col justify-between"><label>Market_Ops</label><button onclick="sellUnit()" class="w-full bg-blue-600 text-white font-black py-4 uppercase italic text-xs tracking-widest shadow-lg shadow-blue-900/20">Register_Sale</button></div>
    </div>

    <div class="bg-zinc-900 border border-zinc-800 overflow-hidden">
        <div class="bg-zinc-800/50 p-4 border-b border-zinc-700 grid grid-cols-6 gap-4 text-[10px] font-black uppercase tracking-widest text-zinc-400">
            <div>Component</div><div class="text-center">Stock / Req</div><div class="text-center">Runway</div><div class="text-center">Lead_Time</div><div class="text-center">Priority</div><div class="text-right">Restock</div>
        </div>
        <div id="analytics-table" class="divide-y divide-zinc-800"></div>
    </div>

    <script>
        let db, SQL, currentProjectId;
        async function init() {
            const urlParams = new URLSearchParams(window.location.search);
            currentProjectId = urlParams.get('id');
            SQL = await initSqlJs({ locateFile: file => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/${file}` });
            const res = await fetch('/get_db');
            const buf = await res.arrayBuffer();
            db = new SQL.Database(new Uint8Array(buf));
            renderCommand();
        }

        async function persist() { await fetch('/save_db', { method: 'POST', body: db.export() }); renderCommand(); }

        function renderCommand() {
            const projRes = db.exec(`SELECT name FROM projects WHERE id=${currentProjectId}`);
            document.getElementById('proj-name').innerText = projRes[0].values[0][0];
            const partRes = db.exec(`SELECT * FROM parts WHERE project_id=${currentProjectId}`);
            const parts = partRes[0] ? partRes[0].values : [];
            const cols = partRes[0] ? partRes[0].columns : [];
            const get = (row, name) => row[cols.indexOf(name)];
            let totalCost = 0, minRunway = Infinity, criticalPart = "HEALTHY", tableHtml = "";

            parts.forEach(p => {
                const stock = parseInt(get(p, 'stock')) || 0, req = parseInt(get(p, 'req')) || 1, leadTime = get(p, 'lead_time') || 7;
                const unitCost = (parseFloat(get(p, 'bulk_cost')) / (parseInt(get(p, 'bulk_qty')) || 1)), runway = Math.floor(stock / req);
                totalCost += (unitCost * req);
                if (runway < minRunway) { minRunway = runway; criticalPart = get(p, 'part_num'); }
                let priorityColor = (runway < 1) ? "text-red-500 animate-pulse" : (runway < 2) ? "text-orange-500" : "text-emerald-500";
                tableHtml += `<div class="grid grid-cols-6 gap-4 p-6 items-center border-b border-zinc-800"><div class="font-bold text-white uppercase tracking-tighter">${get(p, 'part_num')}</div><div class="text-center font-bold text-zinc-400">${stock} / ${req}</div><div class="text-center font-black ${priorityColor}">${runway} Units</div><div class="text-center"><input type="number" onchange="updateLeadTime(${get(p, 'id')}, this.value)" value="${leadTime}" class="bg-black border border-zinc-800 text-center w-16 p-1 text-xs text-white"></div><div class="text-center text-[10px] font-black uppercase italic ${priorityColor}">${runway < 1 ? 'REORDER' : 'OK'}</div><div class="text-right"><button onclick="addStock(${get(p, 'id')}, ${get(p, 'bulk_qty')})" class="text-[9px] font-black text-blue-500 uppercase border border-blue-500/20 px-3 py-1 hover:bg-blue-600 hover:text-white">Restock</button></div></div>`;
            });

            document.getElementById('analytics-table').innerHTML = tableHtml;
            document.getElementById('unit-cost').innerText = `$${totalCost.toFixed(2)}`;
            document.getElementById('build-capacity').innerText = minRunway === Infinity ? 0 : minRunway;
            document.getElementById('critical-part').innerText = minRunway < 2 ? criticalPart : "HEALTHY";
            document.getElementById('critical-part').className = minRunway < 2 ? "text-xl font-black text-red-500 uppercase mt-4 italic" : "text-xl font-black text-emerald-500 uppercase mt-4 italic";
        }

        function addStock(id, qty) { db.run(`UPDATE parts SET stock = stock + ? WHERE id = ?`, [qty, id]); persist(); }
        function updateLeadTime(id, val) { db.run(`UPDATE parts SET lead_time = ? WHERE id = ?`, [val, id]); persist(); }
        function sellUnit() {
            const res = db.exec(`SELECT id, stock, req FROM parts WHERE project_id=${currentProjectId}`);
            const parts = res[0] ? res[0].values : [];
            if (parts.every(p => p[1] >= p[2])) { parts.forEach(p => db.run(`UPDATE parts SET stock = stock - ? WHERE id = ?`, [p[2], p[0]])); persist(); } else { alert("STOCK_LOW"); }
        }
        init();
    </script>
</body>
</html>
