<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>FOUNDRY // COMMAND</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap');
        body { font-family: 'JetBrains+Mono', monospace; background-color: #020617; color: #f8fafc; }
        .tab-btn { transition: all 0.2s ease; border-bottom: 2px solid transparent; opacity: 0.5; }
        .tab-btn.active { border-bottom: 2px solid #3b82f6; color: #3b82f6; opacity: 1; }
        .view { display: none; }
        .view.active { display: block; }
        label { font-size: 9px; font-weight: 900; color: #64748b; text-transform: uppercase; display: block; margin-bottom: 4px; }
        .order-card { background: #09090b; border: 1px solid #1e293b; padding: 1.5rem; margin-bottom: 1rem; }
        .order-card.ready { border-left: 4px solid #3b82f6; }
        .order-card.shortage { border-left: 4px solid #3f3f46; opacity: 0.6; }
        .ship-card { background: #09090b; border: 1px solid #1e293b; border-left: 4px solid #10b981; padding: 1.5rem; margin-bottom: 1rem; }
        .input-std { background: #000; border: 1px solid #1e293b; padding: 12px; color: white; width: 100%; font-size: 14px; outline: none; transition: border 0.2s; }
        .input-std:focus { border-color: #3b82f6; }
        .price-focus { background: #000; border: 1px solid #3b82f6; color: #3b82f6; padding: 10px; font-size: 2rem; font-weight: 900; outline: none; width: 100%; }
    </style>
</head>
<body class="p-10">
    <header class="flex justify-between items-end mb-8 border-b border-zinc-800 pb-8">
        <div>
            <h1 class="text-[10px] font-black text-blue-500 uppercase tracking-[0.4em] mb-2">Command_&_Analytics</h1>
            <h2 id="proj-name" class="text-4xl font-black uppercase italic tracking-tighter text-white">FOUNDRY_SYSTEM</h2>
        </div>
        <nav class="flex gap-8">
            <button onclick="switchTab('intel')" id="btn-intel" class="tab-btn active pb-2 text-[10px] font-black uppercase">Intelligence</button>
            <button onclick="switchTab('sales')" id="btn-sales" class="tab-btn pb-2 text-[10px] font-black uppercase">Sales_Entry</button>
            <button onclick="switchTab('orders')" id="btn-orders" class="tab-btn pb-2 text-[10px] font-black uppercase">Order_Queue</button>
            <button onclick="switchTab('log')" id="btn-log" class="tab-btn pb-2 text-[10px] font-black uppercase text-emerald-500">Logistics</button>
            <button onclick="switchTab('fin')" id="btn-fin" class="tab-btn pb-2 text-[10px] font-black uppercase">Financials</button>
            <a href="/index.html" class="ml-4 text-zinc-500 text-[10px] font-black uppercase hover:text-white transition tracking-widest">Exit_Vault</a>
        </nav>
    </header>

    <div id="view-intel" class="view active">
        <div class="grid grid-cols-4 gap-6 mb-12">
            <div class="bg-zinc-900 border border-zinc-800 p-8">
                <label>System_Runway</label>
                <div id="build-capacity" class="text-5xl font-black italic text-white">0</div>
            </div>
            <div class="bg-zinc-900 border border-zinc-800 p-8">
                <label>Unit_Cost</label>
                <div id="unit-cost" class="text-5xl font-black text-zinc-400 italic">$0.00</div>
            </div>
            <div class="bg-zinc-900 border border-zinc-800 p-8 border-l-4 border-l-emerald-600">
                <label>Available_Stock</label>
                <div id="project-stock" class="text-5xl font-black text-emerald-500 italic">0</div>
            </div>
            <div class="bg-zinc-900 border border-zinc-800 p-8 border-l-4 border-l-blue-600">
                <label>Unit_MSRP</label>
                <div class="flex items-center gap-2">
                    <span class="text-2xl font-black text-blue-500">$</span>
                    <input type="number" id="target-price" step="0.01" onchange="updateTargetPrice(this.value)" class="price-focus" placeholder="0.00">
                </div>
            </div>
        </div>
        <div id="analytics-table" class="bg-zinc-900 border border-zinc-800 mb-6"></div>
        
    </div>

    <div id="view-sales" class="view">
        <div class="max-w-2xl mx-auto bg-zinc-900 border border-zinc-800 p-10">
            <h3 class="text-xl font-black uppercase italic text-blue-500 mb-8 tracking-widest">Order_Registration</h3>
            <div class="space-y-6">
                <div><label>Customer_Name</label><input type="text" id="cust-name" class="input-std" placeholder="CORP / INDIVIDUAL"></div>
                <div><label>Order_Date</label><input type="date" id="order-date" class="input-std"></div>
                <div><label>Shipping_Address</label><textarea id="cust-addr" class="input-std h-24" placeholder="FULL DESTINATION STRING"></textarea></div>
                <div><label>Order_Quantity</label><input type="number" id="order-qty" value="1" min="1" class="input-std text-3xl font-black"></div>
                <button type="button" onclick="registerSale()" class="w-full bg-blue-600 p-5 font-black uppercase italic text-sm tracking-widest hover:bg-blue-500 transition cursor-pointer">Commit_Sale_To_Ledger</button>
            </div>
        </div>
    </div>

    <div id="view-orders" class="view">
        <div class="grid grid-cols-2 gap-10">
            <div>
                <h3 class="text-xl font-black uppercase italic text-zinc-400 tracking-widest mb-6">Allocation_Queue</h3>
                <div id="order-list"></div>
            </div>
            <div>
                <h3 class="text-xl font-black uppercase italic text-orange-500 tracking-widest mb-6">Production_Pipeline</h3>
                <div id="pipeline-list"></div>
            </div>
        </div>
    </div>

    <div id="view-log" class="view">
        <div class="max-w-4xl mx-auto">
            <h3 class="text-xl font-black uppercase italic text-emerald-500 tracking-widest mb-6">Pending_Shipments</h3>
            <div id="shipping-list" class="space-y-4"></div>
        </div>
    </div>

    <div id="view-fin" class="view">
        <div class="grid grid-cols-3 gap-6 mb-10">
            <div class="bg-zinc-900 border border-zinc-800 p-8 border-t-4 border-t-emerald-500">
                <label>Gross_Revenue</label>
                <div id="total-earn" class="text-5xl font-black text-emerald-500">$0.00</div>
            </div>
            <div class="bg-zinc-900 border border-zinc-800 p-8 border-t-4 border-t-red-600">
                <label>Total_Burn</label>
                <div id="total-burn" class="text-5xl font-black text-red-500">$0.00</div>
            </div>
            <div class="bg-zinc-900 border border-zinc-800 p-8 border-t-4 border-t-white">
                <label>Net_Profit</label>
                <div id="net-profit" class="text-5xl font-black text-white">$0.00</div>
            </div>
        </div>
    </div>

    <script>
        let dbVault, dbSales, SQL, currentProjectId;
        let workOrders = [];
    
        async function init() {
            const urlParams = new URLSearchParams(window.location.search);
            currentProjectId = urlParams.get('id'); 
            if (!currentProjectId) return alert("CRITICAL_ERROR: No Project ID found.");
            
            try {
                SQL = await initSqlJs({ locateFile: file => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/${file}` });
                const [vRes, sRes] = await Promise.all([fetch('/get_vault'), fetch('/get_sales')]);
                const [vBuf, sBuf] = await Promise.all([vRes.arrayBuffer(), sRes.arrayBuffer()]);
                
                dbVault = new SQL.Database(new Uint8Array(vBuf));
                dbSales = new SQL.Database(new Uint8Array(sBuf));
                
                // MIGRATION: Add permanent ledger columns if they don't exist
                const prjCols = dbVault.exec("PRAGMA table_info(projects)")[0].values.map(c => c[1]);
                if (!prjCols.includes('revenue')) {
                    dbVault.run("ALTER TABLE projects ADD COLUMN revenue REAL DEFAULT 0.0");
                    dbVault.run("ALTER TABLE projects ADD COLUMN burn REAL DEFAULT 0.0");
                    await fetch('/save_vault', { method: 'POST', body: dbVault.export() });
                }

                workOrders = JSON.parse(localStorage.getItem(`builds_${currentProjectId}`) || '[]');
                renderCommand();
            } catch (e) { console.error("BOOT_FAILURE:", e); }
        }

        async function persist() {
            try {
                await Promise.all([
                    fetch('/save_vault', { method: 'POST', body: dbVault.export() }),
                    fetch('/save_sales', { method: 'POST', body: dbSales.export() })
                ]);
                localStorage.setItem(`builds_${currentProjectId}`, JSON.stringify(workOrders));
                renderCommand();
            } catch (e) { console.error("PERSIST_FAILURE:", e); }
        }
    
        function renderCommand() {
            const partRes = dbVault.exec(`SELECT * FROM parts WHERE project_id='${currentProjectId}'`);
            const parts = partRes[0] ? partRes[0].values : [];
            const cols = partRes[0] ? partRes[0].columns : [];
            const getV = (row, name) => row[cols.indexOf(name)];
    
            // Get Master Data including the new strict ledger columns
            const projRes = dbVault.exec(`SELECT stock, price, name, revenue, burn FROM projects WHERE id='${currentProjectId}'`);
            if (!projRes[0]) return;
            const projectStock = projRes[0].values[0][0];
            const unitMSRP = projRes[0].values[0][1];
            const projRevenue = projRes[0].values[0][3] || 0;
            const projBurn = projRes[0].values[0][4] || 0;
            
            document.getElementById('proj-name').innerText = projRes[0].values[0][2];

            if (!document.getElementById('target-price').value) {
                document.getElementById('target-price').value = unitMSRP.toFixed(2);
            }

            const orderRes = dbSales.exec(`SELECT * FROM orders WHERE project_id='${currentProjectId}'`);
            const orders = orderRes[0] ? orderRes[0].values : [];
            const oCols = orderRes[0] ? orderRes[0].columns : [];
    
            let unitCOGS = 0, minRunway = Infinity, tableHtml = "";
            parts.forEach(p => {
                const stock = parseInt(getV(p, 'stock')) || 0;
                const req = parseInt(getV(p, 'req')) || 0;
                const cost = (parseFloat(getV(p, 'bulk_cost')) || 0) / (parseInt(getV(p, 'bulk_qty')) || 1);
                const runway = req > 0 ? Math.floor(stock / req) : 0;
                unitCOGS += (cost * req);
                if (req > 0 && runway < minRunway) minRunway = runway;
    
                tableHtml += `
                <div class="grid grid-cols-6 gap-4 p-4 border-b border-zinc-800 items-center text-xs">
                    <div class="font-black text-white uppercase">${getV(p, 'part_num').substring(0,12)}</div>
                    <div class="text-center text-zinc-500">${stock} / ${req}</div>
                    <div class="text-center font-black">${runway} U</div>
                    <div class="text-center font-bold text-zinc-600">LT: ${getV(p, 'lead_time') || 7}D</div>
                    <div class="text-center font-black ${(req > 0 && runway < 1) ? 'text-red-500' : 'text-emerald-500'}">${(req > 0 && runway < 1) ? 'SHORT' : 'OK'}</div>
                    <div class="text-right">
                        <button onclick="addStock(${getV(p, 'id')}, ${getV(p, 'bulk_qty')})" class="text-blue-500 border border-blue-500/20 px-2 py-1 hover:bg-blue-500 hover:text-white transition">+ STOCK</button>
                    </div>
                </div>`;
            });
    
            document.getElementById('analytics-table').innerHTML = tableHtml || '<div class="p-8 text-zinc-600 text-center text-[10px]">NO COMPONENTS FOUND</div>';
            document.getElementById('project-stock').innerText = projectStock;
            document.getElementById('unit-cost').innerText = `$${unitCOGS.toFixed(2)}`;
            document.getElementById('build-capacity').innerText = (minRunway === Infinity) ? 0 : minRunway;
    
            renderSalesQueues(orders, oCols, projectStock, parts, cols);
            
            // Render Finances directly from the permanent ledger
            updateFinancials(projRevenue, projBurn);
        }

        function registerSale() {
            const name = document.getElementById('cust-name').value;
            const addr = document.getElementById('cust-addr').value;
            const qty = parseInt(document.getElementById('order-qty').value);
            const date = document.getElementById('order-date').value;

            if(!name || isNaN(qty)) return alert("INVALID_ORDER: Check customer name and quantity.");

            // 1. Add order to queue
            dbSales.run(`INSERT INTO orders (project_id, customer, address, qty, status, date) VALUES (?, ?, ?, ?, 'PENDING', ?)`, 
                        [currentProjectId, name, addr, qty, date]);
            
            // 2. INCREASE REVENUE (Locks in the money at time of sale)
            const priceRes = dbVault.exec(`SELECT price FROM projects WHERE id='${currentProjectId}'`);
            const currentPrice = priceRes[0] ? parseFloat(priceRes[0].values[0][0]) : 0;
            const totalSaleValue = qty * currentPrice;
            dbVault.run(`UPDATE projects SET revenue = revenue + ? WHERE id = ?`, [totalSaleValue, currentProjectId]);
            
            // Clear Form
            document.getElementById('cust-name').value = "";
            document.getElementById('cust-addr').value = "";
            document.getElementById('order-qty').value = "1";
            
            persist();
            switchTab('orders'); 
        }

        function addStock(id, qty) { 
            // 1. Calculate how much money this stock cost to buy
            const pRes = dbVault.exec(`SELECT bulk_cost, bulk_qty FROM parts WHERE id=${id}`)[0].values[0];
            const costPerUnit = (parseFloat(pRes[0]) || 0) / (parseInt(pRes[1]) || 1);
            const spend = costPerUnit * qty;

            // 2. Increase Physical Stock
            dbVault.run(`UPDATE parts SET stock = stock + ? WHERE id = ?`, [qty, id]); 
            
            // 3. INCREASE BURN (Locks in the money spent)
            dbVault.run(`UPDATE projects SET burn = burn + ? WHERE id = ?`, [spend, currentProjectId]);

            persist(); 
        }

        function fillOrder(id) {
            const orderRes = dbSales.exec(`SELECT qty FROM orders WHERE id=${id}`);
            const qtyNeeded = orderRes[0].values[0][0];
            const stockRes = dbVault.exec(`SELECT stock FROM projects WHERE id = '${currentProjectId}'`);
            const currentStock = stockRes[0].values[0][0];

            if (currentStock >= qtyNeeded) {
                dbVault.run(`UPDATE projects SET stock = stock - ? WHERE id = ?`, [qtyNeeded, currentProjectId]);
                dbSales.run(`UPDATE orders SET status = 'FILLED' WHERE id = ?`, [id]);
                persist();
            } else { 
                const missing = qtyNeeded - currentStock;
                if(confirm(`INSUFFICIENT STOCK: Need ${qtyNeeded}U, but only have ${currentStock}U.\nCreate production order for the missing ${missing} units?`)) {
                    createWorkOrder(missing);
                }
            }
        }

        function finalizeBuild(idx) {
            const wo = workOrders[idx];
            const partRes = dbVault.exec(`SELECT id, part_num, stock, req FROM parts WHERE project_id='${currentProjectId}'`);
            const components = partRes[0].values;
            
            const canBuild = components.every(p => p[2] >= (p[3] * wo.qty));

            if (canBuild) {
                components.forEach(p => {
                    dbVault.run(`UPDATE parts SET stock = stock - ? WHERE id = ?`, [(p[3] * wo.qty), p[0]]);
                });
                dbVault.run(`UPDATE projects SET stock = stock + ? WHERE id = ?`, [wo.qty, currentProjectId]);
                workOrders.splice(idx, 1);
                persist();
            } else { alert("PRODUCTION_HALTED: Check Raw Material inventory."); }
        }

        function renderSalesQueues(orders, oCols, stock, components, pCols) {
            const sIdx = oCols.indexOf('status'), qIdx = oCols.indexOf('qty'), cIdx = oCols.indexOf('customer'), idIdx = oCols.indexOf('id');

            document.getElementById('order-list').innerHTML = orders.filter(o => o[sIdx] === 'PENDING').map(o => `
                <div class="order-card ${stock >= o[qIdx] ? 'ready' : 'shortage'}">
                    <div class="text-lg font-black text-white">${o[cIdx]}</div>
                    <div class="text-[10px] mb-4">${o[qIdx]} UNITS NEEDED</div>
                    <button onclick="fillOrder(${o[idIdx]})" class="w-full ${stock >= o[qIdx] ? 'bg-blue-600' : 'bg-zinc-800 opacity-50'} py-2 text-[10px] font-black uppercase">Fill_Order</button>
                </div>
            `).join('') || '<div class="p-4 text-xs italic">Queue Clear</div>';
            
            document.getElementById('pipeline-list').innerHTML = `
                <div class="mb-4 flex gap-2">
                    <input type="number" id="manual-build-qty" placeholder="Qty" class="bg-black border border-zinc-800 p-2 text-xs w-20 text-white outline-none">
                    <button onclick="createWorkOrder(document.getElementById('manual-build-qty').value)" class="bg-orange-600 px-4 py-2 text-[10px] font-black uppercase flex-1">Manual_Build_Order</button>
                </div>
            ` + workOrders.map((w, idx) => {
                const canFin = components.every(p => p[pCols.indexOf('stock')] >= (p[pCols.indexOf('req')] * w.qty));
                return `
                <div class="bg-zinc-900 border-l-4 ${canFin ? 'border-orange-500' : 'border-zinc-700'} p-4 mb-2">
                    <div class="text-white font-bold mb-2 uppercase text-[10px]">Batch: ${w.qty} Units</div>
                    <button onclick="finalizeBuild(${idx})" class="w-full ${canFin ? 'bg-orange-600' : 'bg-zinc-800 text-zinc-500'} py-2 text-[10px] font-black uppercase">
                        ${canFin ? 'Finalize_&_Stock' : 'Waiting_For_Parts'}
                    </button>
                </div>`;
            }).join('');

            document.getElementById('shipping-list').innerHTML = orders.filter(o => o[sIdx] === 'FILLED').map(o => `
                <div class="ship-card">
                    <div class="text-sm font-black text-white">${o[cIdx]}</div>
                    <button onclick="authorizeShipment(${o[idIdx]})" class="w-full bg-emerald-600 py-2 mt-2 text-[10px] font-black uppercase">Ship_Now</button>
                </div>
            `).join('');
        }

        // Extremely simplified financial logic based on permanent DB ledger
        function updateFinancials(revenue, burn) {
            document.getElementById('total-earn').innerText = `$${revenue.toFixed(2)}`;
            document.getElementById('total-burn').innerText = `$${burn.toFixed(2)}`;
            
            const profit = revenue - burn;
            const profEl = document.getElementById('net-profit');
            profEl.innerText = `$${profit.toFixed(2)}`;
            profEl.className = `text-5xl font-black ${profit >= 0 ? 'text-white' : 'text-red-500'}`;
        }

        function createWorkOrder(qty) { 
            if(!qty || qty < 1) return;
            workOrders.push({ qty: parseInt(qty) }); 
            persist(); 
        }

        function updateTargetPrice(val) {
            dbVault.run(`UPDATE projects SET price = ? WHERE id = ?`, [val, currentProjectId]);
            persist(); 
        }

        function authorizeShipment(id) { dbSales.run(`UPDATE orders SET status = 'SHIPPED' WHERE id = ?`, [id]); persist(); }
        
        function switchTab(t) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('view-' + t).classList.add('active');
            document.getElementById('btn-' + t).classList.add('active');
        }
    
        init();
    </script>
</body>
</html>
