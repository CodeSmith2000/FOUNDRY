<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>FOUNDRY // PRODUCTION</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap');
        body { font-family: 'JetBrains+Mono', monospace; background-color: #020617; color: #f8fafc; overflow: hidden; }
        .canvas-area { width: 5000px; height: 5000px; background-image: radial-gradient(#1e293b 1px, transparent 1px); background-size: 40px 40px; position: relative; }
        #svg-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; }
        .node { position: absolute; min-width: 220px; background: #0f172a; border: 1px solid #334155; border-radius: 4px; padding: 12px; z-index: 10; cursor: grab; border-top: 4px solid #3b82f6; transition: min-height 0.2s ease; }
        .type-process { border-top-color: #f59e0b; }
        .socket { width: 14px; height: 14px; background: #1e293b; border: 2px solid #334155; border-radius: 50%; position: absolute; cursor: crosshair; z-index: 30; }
        .socket:hover, .socket.active { background: #3b82f6; box-shadow: 0 0 10px #3b82f6; }
        .socket-out { right: -8px; top: 35px; }
        .socket-in { left: -8px; }
        .hud-panel { position: absolute; top: 20px; left: 20px; width: 260px; background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(10px); border: 1px solid #334155; padding: 15px; z-index: 100; border-radius: 8px; }
    </style>
</head>
<body>
    <aside class="hud-panel">
        <h3 class="text-[10px] font-black text-blue-500 uppercase mb-4 tracking-widest">Foundry_Ops</h3>
        <div id="router-part-list" class="space-y-2 mb-4 max-h-96 overflow-y-auto"></div>
        <div class="border-t border-slate-700 pt-4 space-y-2">
            <button onclick="addProcessNode()" class="w-full bg-amber-600/20 text-amber-500 py-2 text-[10px] font-bold uppercase border border-amber-600">Add_Process</button>
            <button onclick="saveLayout()" class="w-full bg-blue-600 py-2 text-[10px] font-bold uppercase">Save_Flow</button>
            <a href="/index.html" class="block text-center w-full text-zinc-500 py-2 text-[9px] font-bold uppercase">Exit_To_Vault</a>
        </div>
    </aside>

    <div id="router-viewport" class="w-full h-screen overflow-auto bg-slate-950">
        <div id="router-canvas" class="canvas-area">
            <svg id="svg-canvas"><defs><marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3b82f6"/></marker></defs></svg>
        </div>
    </div>

    <div id="modalContainer" class="hidden fixed inset-0 z-[200] bg-black/90 backdrop-blur-md flex items-center justify-center p-4"><div id="modalContent" class="bg-slate-950 border border-slate-800 w-full max-w-2xl p-10 border-t-4 border-t-amber-600"></div></div>

    <script>
        let db, SQL, currentProjectId, sourceSocketId = null;
        let connections = [], moveDetected = false;
        let selectedWireIndex = null, selectedNodeId = null;

        async function init() {
            const urlParams = new URLSearchParams(window.location.search);
            currentProjectId = urlParams.get('id');
            SQL = await initSqlJs({ locateFile: file => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/${file}` });
            const res = await fetch('/get_db');
            const buf = await res.arrayBuffer();
            db = new SQL.Database(new Uint8Array(buf));
            const parts = db.exec(`SELECT part_hash, part_num, img FROM parts WHERE project_id=${currentProjectId}`)[0]?.values || [];
            document.getElementById('router-part-list').innerHTML = parts.map(p => `<div onclick="spawnNode('part', 400, 300, '${p[1]}', '${p[2]}', 'hash_${p[0]}')" class="bg-slate-800 border border-slate-700 p-3 text-xs font-bold uppercase cursor-pointer hover:border-blue-500 transition">${p[1]}</div>`).join('');
            
            window.addEventListener('keydown', (e) => {
                if (e.key === 'Delete' || e.key === 'Backspace') {
                    if (selectedWireIndex !== null) { connections.splice(selectedWireIndex, 1); selectedWireIndex = null; drawWires(); saveLayout(); } 
                    else if (selectedNodeId && !selectedNodeId.startsWith('f_')) { removeNode(selectedNodeId); selectedNodeId = null; saveLayout(); }
                }
            });
            document.getElementById('router-viewport').addEventListener('mousedown', (e) => { if (e.target.tagName !== 'path' && !e.target.closest('.node')) { selectedWireIndex = null; deselectNodes(); drawWires(); } });
            loadSavedLayout();
        }

        function deselectNodes() { selectedNodeId = null; document.querySelectorAll('.node').forEach(n => n.style.borderColor = ''); }

        function addProcessNode() {
            const content = document.getElementById('modalContent');
            content.innerHTML = `<div class="space-y-6"><h2 class="text-2xl font-black uppercase italic text-amber-500 tracking-tighter">Initialize_Process</h2><select id="processPreset" onchange="document.getElementById('customProcessName').value = this.value" class="w-full bg-zinc-900 border border-zinc-800 p-3 text-sm font-bold uppercase text-white outline-none"><optgroup label="Fabrication"><option value="3D_PRINTING">3D_PRINTING</option><option value="CNC_MACHINING">CNC_MACHINING</option><option value="WELDING_FAB">WELDING_FAB</option></optgroup><optgroup label="Preparation"><option value="ULTRASONIC_CLEAN">ULTRASONIC_CLEAN</option><option value="POWDER_COATING">POWDER_COATING</option></optgroup></select><input type="text" id="customProcessName" placeholder="PROCESS_NAME..." class="w-full bg-zinc-900 border border-zinc-800 p-4 text-xl font-black uppercase text-white outline-none"><div class="flex gap-4"><button onclick="toggleModal(false)" class="flex-1 text-zinc-500 font-bold uppercase">Cancel</button><button onclick="confirmProcess()" class="flex-2 bg-amber-600 p-4 font-black uppercase text-white">Deploy</button></div></div>`;
            toggleModal(true);
            const input = document.getElementById('customProcessName');
            input.focus(); input.onkeydown = (e) => { if(e.key === 'Enter') confirmProcess(); };
        }

        function confirmProcess() { const name = document.getElementById('customProcessName').value.trim(); if (name) { spawnNode('process', 500, 400, name, ''); toggleModal(false); } }

        function spawnNode(type, x, y, label, img, identifier, instr = '') {
            const nodeId = identifier || 'n_' + Math.random().toString(36).substr(2, 5);
            if (document.getElementById(nodeId)) return;
            const n = document.createElement('div');
            n.id = nodeId; n.className = `node type-${type}`; n.style.left = x + 'px'; n.style.top = y + 'px';
            n.dataset.type = type; n.dataset.label = label; n.dataset.instr = instr;
            let sockets = (type === 'part') ? `<div class="socket socket-out" id="out_${nodeId}" style="top:35px;" onclick="handleWire(event, 'out', '${nodeId}')"></div>` : `<div class="in-cont" id="in_c_${nodeId}"><div class="socket socket-in" id="in_${nodeId}_0" style="top:35px;" onclick="handleWire(event, 'in', '${nodeId}', 0)"></div></div>` + ((type === 'process') ? `<div class="socket socket-out" id="out_${nodeId}" style="top:35px;" onclick="handleWire(event, 'out', '${nodeId}')"></div>` : '');
            n.innerHTML = `<div class="text-[8px] text-zinc-600 font-black mb-1 uppercase pointer-events-none">${type}</div><div class="flex gap-2 items-center text-[11px] font-bold uppercase pointer-events-none">${img ? `<img src="${img}" class="w-6 h-6 object-cover bg-black border border-zinc-800">` : ''}${label}</div>${sockets}`;
            n.addEventListener('mousedown', (e) => { if (e.target.classList.contains('socket')) return; deselectNodes(); selectedWireIndex = null; selectedNodeId = nodeId; n.style.borderColor = '#ef4444'; drawWires(); });
            n.addEventListener('dblclick', (e) => { if (type === 'process') editProcess(nodeId); });
            document.getElementById('router-canvas').appendChild(n);
            makeDraggable(n);
        }

        function editProcess(id) {
            const n = document.getElementById(id);
            document.getElementById('modalContent').innerHTML = `<h2 class="text-2xl font-black uppercase mb-4 text-amber-500 italic">${n.dataset.label} // DATA</h2><textarea id="p_instr" class="w-full bg-zinc-950 border border-zinc-800 p-4 h-64 font-bold text-white outline-none focus:border-amber-500">${n.dataset.instr || ''}</textarea><div class="flex gap-4 mt-8"><button onclick="toggleModal(false)" class="flex-1 text-zinc-500 font-bold uppercase">Close</button><button onclick="saveProc('${id}')" class="flex-1 bg-amber-600 py-3 font-black uppercase text-white">Commit</button></div>`;
            toggleModal(true);
        }

        function saveProc(id) { document.getElementById(id).dataset.instr = document.getElementById('p_instr').value; toggleModal(false); saveLayout(); }

        function handleWire(e, type, nodeId, idx) {
            e.stopPropagation();
            const sid = type === 'out' ? `out_${nodeId}` : `in_${nodeId}_${idx}`;
            if (!sourceSocketId) { if (type === 'in') return; sourceSocketId = sid; document.getElementById(sid).classList.add('active'); } 
            else { if (type === 'out') { document.getElementById(sourceSocketId).classList.remove('active'); sourceSocketId = sid; document.getElementById(sid).classList.add('active'); return; }
                connections.push({ sid: sourceSocketId, tid: sid, tn: nodeId });
                if (type === 'in') createPort(nodeId, idx + 1);
                document.getElementById(sourceSocketId).classList.remove('active'); sourceSocketId = null; drawWires();
            }
        }

        function createPort(nodeId, idx) {
            const c = document.getElementById(`in_c_${nodeId}`);
            if (!c || document.getElementById(`in_${nodeId}_${idx}`)) return;
            const ns = document.createElement('div'); ns.className = 'socket socket-in'; ns.id = `in_${nodeId}_${idx}`;
            const top = 35 + (idx * 22); ns.style.top = top + 'px';
            ns.onclick = (e) => handleWire(e, 'in', nodeId, idx);
            c.appendChild(ns); document.getElementById(nodeId).style.minHeight = (top + 40) + "px";
        }

        function drawWires() {
            const svg = document.getElementById('svg-canvas');
            svg.querySelectorAll('path:not(defs path)').forEach(p => p.remove());
            const cR = document.getElementById('router-canvas').getBoundingClientRect();
            connections.forEach((c, index) => {
                const s = document.getElementById(c.sid), t = document.getElementById(c.tid);
                if (!s || !t) return;
                const sR = s.getBoundingClientRect(), tR = t.getBoundingClientRect();
                const x1 = sR.left - cR.left + 7, y1 = sR.top - cR.top + 7, x2 = tR.left - cR.left + 7, y2 = tR.top - cR.top + 7;
                const path = document.createElementNS("http://www.w3.org/2000/svg", "path"), dx = Math.abs(x1 - x2) * 0.5;
                const isSelected = selectedWireIndex === index;
                path.setAttribute("d", `M ${x1} ${y1} C ${x1 + dx} ${y1}, ${x2 - dx} ${y2}, ${x2} ${y2}`);
                path.setAttribute("stroke", isSelected ? "#ef4444" : "#3b82f6");
                path.setAttribute("stroke-width", isSelected ? "4" : "2");
                path.setAttribute("fill", "none"); path.setAttribute("marker-end", "url(#arrow)");
                path.style.cursor = "pointer"; path.style.pointerEvents = "auto";
                path.onmousedown = (e) => { e.stopPropagation(); deselectNodes(); selectedWireIndex = index; drawWires(); };
                svg.appendChild(path);
            });
        }

        function makeDraggable(el) {
            let sX, sY;
            el.onmousedown = (e) => { if(e.target.classList.contains('socket')) return; moveDetected = false; sX = e.clientX; sY = e.clientY;
                document.onmousemove = (ev) => { if (ev.clientX !== sX || ev.clientY !== sY) moveDetected = true; el.style.left = (el.offsetLeft - (sX - ev.clientX))+'px'; el.style.top = (el.offsetTop - (sY - ev.clientY))+'px'; sX = ev.clientX; sY = ev.clientY; drawWires(); };
                document.onmouseup = () => document.onmousemove = null;
            };
        }

        function saveLayout() {
            localStorage.setItem(`flow_v1_${currentProjectId}`, JSON.stringify({ nodes: [...document.querySelectorAll('.node')].map(n => ({ id: n.id, type: n.dataset.type, label: n.dataset.label, x: parseInt(n.style.left), y: parseInt(n.style.top), h: n.style.minHeight, instr: n.dataset.instr })), links: connections }));
            const toast = document.createElement('div'); toast.className = "fixed bottom-8 right-8 bg-blue-600 px-6 py-3 font-black uppercase italic tracking-widest z-[300]"; toast.innerText = "FOUNDRY_SYNC_COMPLETE"; document.body.appendChild(toast); setTimeout(() => toast.remove(), 2500);
        }

        function loadSavedLayout() {
            const rawData = localStorage.getItem(`flow_v1_${currentProjectId}`);
            if (!rawData) { spawnNode('final', 1000, 300, 'PROJECT_ASSEMBLY', '', 'f_root'); return; }
            const data = JSON.parse(rawData); connections = data.links || [];
            data.nodes.forEach(n => { spawnNode(n.type, n.x, n.y, n.label, '', n.id, n.instr); if(n.h) document.getElementById(n.id).style.minHeight = n.h; });
            connections.forEach(l => { const portIndex = parseInt(l.tid.split('_').pop()); if (portIndex > 0) { for(let i=1; i<=portIndex; i++) createPort(l.tn, i); } });
            document.querySelectorAll('.in-cont').forEach(cont => createPort(cont.id.replace('in_c_', ''), cont.querySelectorAll('.socket-in').length));
            setTimeout(drawWires, 50); setTimeout(drawWires, 300);
        }

        function removeNode(id) { connections = connections.filter(c => !c.sid.includes(id) && !c.tid.includes(id)); const el = document.getElementById(id); if (el) el.remove(); drawWires(); }
        function toggleModal(s) { document.getElementById('modalContainer').classList.toggle('hidden', !s); }
        init();
    </script>
</body>
</html>
